# Publishes the hosted replay demo (the static files in site/) to GitHub Pages.
#
# site/ is built locally by apps/grandma-ghost/export_demo.py and committed, because the
# raw recordings it is built from are not in the repository. This workflow only uploads it.
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy replay demo

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
